// STATIC MODE LOGIC
// ══════════════════════════════════════════════════════════════
const units = [...new Set(CARDS.map(c => c.unit))].sort((a,b) => {
  const na = parseFloat(a), nb = parseFloat(b);
  if (!isNaN(na) && !isNaN(nb)) return na - nb;
  if (!isNaN(na)) return -1;
  if (!isNaN(nb)) return 1;
  return a.localeCompare(b);
});
let activeUnit = 'all';
let deck = [];
let currentIndex = 0;
let gotIt = new Set();

function buildFilters() {
  const bar = document.getElementById('filter-bar');
  let html = '<button class="filter-btn active" data-unit="all">All (' + CARDS.length + ')</button>';
  units.forEach(u => {
    const count = CARDS.filter(c => c.unit === u).length;
    html += `<button class="filter-btn" data-unit="${u}">${u} (${count})</button>`;
  });
  bar.innerHTML = html;
  bar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeUnit = btn.dataset.unit;
      resetDeck();
    });
  });
}

function resetDeck() {
  deck = activeUnit === 'all' ? [...CARDS] : CARDS.filter(c => c.unit === activeUnit);
  currentIndex = 0;
  gotIt.clear();
  renderCard();
  updateProgress();
  document.getElementById('flashcard').classList.remove('flipped');
}

function renderCard() {
  if (deck.length === 0) {
    document.getElementById('card-unit').textContent = '';
    document.getElementById('card-term').textContent = 'No cards in this category';
    document.getElementById('card-definition').textContent = '';
    document.getElementById('card-exam-note').textContent = '';
    document.getElementById('card-counter').textContent = '0 / 0';
    return;
  }
  const c = deck[currentIndex];
  document.getElementById('card-unit').textContent = c.unit;
  document.getElementById('card-term').textContent = c.term;
  document.getElementById('card-definition').textContent = c.def;
  document.getElementById('card-exam-note').textContent = c.note || '';
  document.getElementById('card-counter').textContent = `${currentIndex + 1} / ${deck.length}`;
  document.getElementById('flashcard').classList.remove('flipped');
}

function updateProgress() {
  const total = deck.length;
  const done = [...gotIt].filter(i => i < total).length;
  document.getElementById('progress-label').textContent = `${done} / ${total} known`;
  document.getElementById('progress-fill').style.width = total ? `${(done/total)*100}%` : '0%';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

document.getElementById('flashcard').addEventListener('click', () => {
  document.getElementById('flashcard').classList.toggle('flipped');
});
document.getElementById('prev-btn').addEventListener('click', () => {
  if (!deck.length) return;
  currentIndex = (currentIndex - 1 + deck.length) % deck.length;
  renderCard();
});
document.getElementById('next-btn').addEventListener('click', () => {
  if (!deck.length) return;
  currentIndex = (currentIndex + 1) % deck.length;
  renderCard();
});
document.getElementById('got-it-btn').addEventListener('click', () => {
  if (!deck.length) return;
  gotIt.add(currentIndex);
  updateProgress();
  if (gotIt.size < deck.length) {
    let next = (currentIndex + 1) % deck.length;
    while (gotIt.has(next) && gotIt.size < deck.length) next = (next + 1) % deck.length;
    currentIndex = next;
    renderCard();
  } else {
    document.getElementById('card-unit').textContent = '';
    document.getElementById('card-term').textContent = 'All done!';
    document.getElementById('card-definition').textContent = 'You\'ve marked all cards as known. Hit Reset to go again.';
    document.getElementById('card-exam-note').textContent = '';
    document.getElementById('flashcard').classList.remove('flipped');
  }
});
document.getElementById('shuffle-btn').addEventListener('click', () => {
  shuffle(deck); currentIndex = 0; gotIt.clear(); renderCard(); updateProgress();
});
document.getElementById('reset-btn').addEventListener('click', resetDeck);
document.addEventListener('keydown', e => {
  if (document.getElementById('static-panel').classList.contains('hidden')) return;
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') document.getElementById('prev-btn').click();
  if (e.key === 'ArrowRight') document.getElementById('next-btn').click();
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); document.getElementById('flashcard').click(); }
});
buildFilters();
resetDeck();

// ══════════════════════════════════════════════════════════════
// AI GENERATE MODE
// ══════════════════════════════════════════════════════════════
const WORKER_URL = 'https://nishkam-marker.j-kerrisk.workers.dev';
let aiDeck = [];
let aiIndex = 0;

document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const mode = tab.dataset.mode;
    document.getElementById('static-panel').classList.toggle('hidden', mode !== 'static');
    const aiPanel = document.getElementById('ai-panel');
    aiPanel.classList.toggle('visible', mode === 'ai');
    aiPanel.classList.toggle('ai-panel', mode !== 'ai');
  });
});

document.querySelectorAll('.suggestion-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.getElementById('ai-topic').value = chip.textContent;
    document.getElementById('ai-generate-btn').click();
  });
});

document.getElementById('ai-generate-btn').addEventListener('click', async () => {
  const topic = document.getElementById('ai-topic').value.trim();
  if (!topic) return;
  const btn = document.getElementById('ai-generate-btn');
  const status = document.getElementById('ai-status');
  btn.disabled = true; btn.textContent = 'Generating...';
  status.textContent = 'Creating flashcards — this takes a few seconds...';
  status.classList.remove('error');
  document.getElementById('ai-card-container').classList.add('hidden');
  document.getElementById('ai-controls').classList.add('hidden');

  try {
    const resp = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 3500,
        messages: [{role:'user',content:`You are an expert AQA A-Level Business Studies teacher. Generate exactly 10 flashcards on the topic: "${topic}".

Rules:
- Every card must be accurate to the AQA 7138 specification (new spec, first exams June 2027)
- Use simple, clear language a Year 12 or Year 13 student would understand
- Definitions should be precise but not overly academic
- Where relevant, include a short exam note (common mistakes, what examiners look for, or how the concept links to other topics)
- The new spec units are: 3.1 (3.1.1–3.1.4), 3.2 (3.2.1–3.2.3), 3.3 (3.3.1–3.3.4)
- Use "stakeholder mapping" not "Mendelow's Matrix"
- Herzberg: pay is a hygiene factor, NOT a motivator
- Be accurate with formulae

Return ONLY a JSON array with no other text. Each object must have:
- "term": the front of the card (a concept, term, formula name, or question)
- "def": the back of the card (the definition, explanation, or answer)
- "note": a short exam tip or empty string if none needed

Example format:
[{"term":"Capacity utilisation","def":"The percentage of total capacity actually being used. Formula: actual output ÷ maximum output × 100.","note":"Low utilisation raises unit costs because fixed costs are spread over fewer units."}]`}]
      })
    });
    if (!resp.ok) throw new Error('Could not reach the server. Try again in a moment.');
    const data = await resp.json();
    let text = '';
    if (data.content && Array.isArray(data.content)) text = data.content.map(b => b.text || '').join('');
    else if (typeof data === 'string') text = data;
    else if (data.text) text = data.text;
    const jsonMatch = text.match(/\[[\s\S]*\]/);
    if (!jsonMatch) throw new Error('Couldn\'t parse the response. Try again.');
    aiDeck = JSON.parse(jsonMatch[0]);
    if (!Array.isArray(aiDeck) || !aiDeck.length) throw new Error('No cards generated. Try a different topic.');
    aiIndex = 0; renderAiCard();
    document.getElementById('ai-card-container').classList.remove('hidden');
    document.getElementById('ai-controls').classList.remove('hidden');
    status.textContent = `${aiDeck.length} cards generated`;
  } catch (err) {
    status.textContent = err.message || 'Something went wrong. Try again.';
    status.classList.add('error');
  } finally { btn.disabled = false; btn.textContent = 'Generate'; }
});

document.getElementById('ai-topic').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('ai-generate-btn').click();
});

function renderAiCard() {
  if (!aiDeck.length) return;
  const c = aiDeck[aiIndex];
  document.getElementById('ai-card-unit').textContent = 'Generated';
  document.getElementById('ai-card-term').textContent = c.term || '';
  document.getElementById('ai-card-definition').textContent = c.def || '';
  document.getElementById('ai-card-exam-note').textContent = c.note || '';
  document.getElementById('ai-card-counter').textContent = `${aiIndex + 1} / ${aiDeck.length}`;
  document.getElementById('ai-flashcard').classList.remove('flipped');
}

document.getElementById('ai-flashcard').addEventListener('click', () => {
  document.getElementById('ai-flashcard').classList.toggle('flipped');
});
document.getElementById('ai-prev-btn').addEventListener('click', () => {
  if (!aiDeck.length) return; aiIndex = (aiIndex - 1 + aiDeck.length) % aiDeck.length; renderAiCard();
});
document.getElementById('ai-next-btn').addEventListener('click', () => {
  if (!aiDeck.length) return; aiIndex = (aiIndex + 1) % aiDeck.length; renderAiCard();
});
document.getElementById('ai-shuffle-btn').addEventListener('click', () => {
  shuffle(aiDeck); aiIndex = 0; renderAiCard();
});
</script>
